<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spider Climb - 蜘蛛の糸登り</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
            font-family: monospace, sans-serif;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// --- 定数 ---
const GRAVITY = 0.22;
const ARROW_SPEED = 0.05;
const ROPE_SPEED = 24;
const ROPE_PULL_SPEED = 10; // 糸を引き寄せるスピード
const MIN_ROPE_LENGTH = 110; // 巻き取り後の目標ロープ長

let gameState = 'START';
let cameraY = 0;
let maxAltitude = 0;
let stars = [];

let player = {
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    radius: 12,
    angle: 0,
    ropeState: 'IDLE', // 'IDLE', 'SHOOTING', 'ATTACHED'
    ropeX: 0,
    ropeY: 0,
    ropeVx: 0,
    ropeVy: 0,
    currentRopeLen: 0, // 現在のロープの長さ制限
    targetFirefly: null
};

let fireflies = [];

function initStars() {
    stars = [];
    for (let i = 0; i < 150; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * -10000,
            size: Math.random() * 2 + 1,
            alpha: Math.random()
        });
    }
}

function initGame() {
    player.x = canvas.width / 2;
    player.y = canvas.height - 100;
    player.vx = 0;
    player.vy = 0;
    player.angle = -Math.PI / 2;
    player.ropeState = 'IDLE';
    player.targetFirefly = null;

    cameraY = 0;
    maxAltitude = 0;

    fireflies = [];
    // スタート近くの大きめホタル（半径大きめに設定）
    fireflies.push({ x: canvas.width / 2, y: canvas.height - 280, radius: 24, pulse: 0 });
    
    generateFireflies(-5000);
    initStars();
    gameState = 'PLAYING';
}

// 大きなホタルを生成
function generateFireflies(upToY) {
    let startY = fireflies.length > 0 ? fireflies[fireflies.length - 1].y - 160 : canvas.height - 450;
    while (startY > upToY) {
        const x = Math.random() * (canvas.width - 160) + 80;
        fireflies.push({
            x: x,
            y: startY,
            radius: 20 + Math.random() * 10, // 以前(8~12)より大幅に拡大(20~30)
            pulse: Math.random() * Math.PI * 2
        });
        startY -= 120 + Math.random() * 90;
    }
}

function handleTap() {
    if (gameState === 'START' || gameState === 'GAMEOVER') {
        initGame();
        return;
    }

    if (player.ropeState === 'IDLE') {
        player.ropeState = 'SHOOTING';
        player.ropeX = player.x;
        player.ropeY = player.y;
        player.ropeVx = Math.cos(player.angle) * ROPE_SPEED;
        player.ropeVy = Math.sin(player.angle) * ROPE_SPEED;
    } else if (player.ropeState === 'ATTACHED' || player.ropeState === 'SHOOTING') {
        // 糸を放す（現在の慣性 velocity を維持して飛び出す）
        player.ropeState = 'IDLE';
        player.targetFirefly = null;
    }
}

window.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handleTap();
});

function update() {
    if (gameState !== 'PLAYING') return;

    if (player.ropeState === 'IDLE') {
        player.angle += ARROW_SPEED;
    }

    // 糸の発射
    if (player.ropeState === 'SHOOTING') {
        player.ropeX += player.ropeVx;
        player.ropeY += player.ropeVy;

        const distFromPlayer = Math.hypot(player.ropeX - player.x, player.ropeY - player.y);
        if (distFromPlayer > 700) {
            player.ropeState = 'IDLE';
        }

        // ホタルとの判定（ホタルが大きくなったので当たりやすい）
        for (let ff of fireflies) {
            const d = Math.hypot(player.ropeX - ff.x, player.ropeY - ff.y);
            if (d < ff.radius + 12) {
                player.ropeState = 'ATTACHED';
                player.targetFirefly = ff;
                player.ropeX = ff.x;
                player.ropeY = ff.y;
                // 初期ロープ長を記録
                player.currentRopeLen = Math.hypot(player.x - ff.x, player.y - ff.y);
                break;
            }
        }
    }

    // 物理処理（重力加算）
    player.vy += GRAVITY;

    if (player.ropeState === 'ATTACHED' && player.targetFirefly) {
        const ff = player.targetFirefly;

        // 徐々にロープ長を目標値まで短縮（巻き取り）
        if (player.currentRopeLen > MIN_ROPE_LENGTH) {
            player.currentRopeLen = Math.max(MIN_ROPE_LENGTH, player.currentRopeLen - ROPE_PULL_SPEED);
        }

        // 自由移動後の次位置を仮計算
        let nextX = player.x + player.vx;
        let nextY = player.y + player.vy;

        let dx = nextX - ff.x;
        let dy = nextY - ff.y;
        let dist = Math.hypot(dx, dy);

        // 【ロープの条件】距離が現在のロープ長を超えたときだけ張力をかけて円運動（たわみを許容）
        if (dist > player.currentRopeLen) {
            let nx = dx / dist;
            let ny = dy / dist;

            // 制限長さに位置を補正
            player.x = ff.x + nx * player.currentRopeLen;
            player.y = ff.y + ny * player.currentRopeLen;

            // 速度ベクトルから半径方向成分を除去（接線方向の慣性を維持）
            let dot = player.vx * nx + player.vy * ny;
            if (dot > 0) { // 外側へ向かう速度のみ打ち消す
                player.vx -= dot * nx;
                player.vy -= dot * ny;
            }
        } else {
            // ロープ長の内側にいる時は「たわみ状態」なので自由落下・慣性移動
            player.x = nextX;
            player.y = nextY;
        }

        // わずかな空気抵抗
        player.vx *= 0.998;
        player.vy *= 0.998;

    } else {
        // 通常移動
        player.x += player.vx;
        player.y += player.vy;
        player.vx *= 0.992;
    }

    // 壁バウンド
    if (player.x - player.radius < 0) {
        player.x = player.radius;
        player.vx *= -0.6;
    } else if (player.x + player.radius > canvas.width) {
        player.x = canvas.width - player.radius;
        player.vx *= -0.6;
    }

    // 地面衝突
    const groundY = canvas.height - 30;
    if (player.y + player.radius > groundY) {
        player.y = groundY - player.radius;
        player.vy = 0;
        player.vx *= 0.8;
    }

    // カメラ追従
    const targetCameraY = player.y - canvas.height * 0.65;
    if (targetCameraY < cameraY) {
        cameraY += (targetCameraY - cameraY) * 0.1;
    }

    // スコア計算
    const currentAltitude = Math.floor((canvas.height - 30 - player.y) / 10);
    if (currentAltitude > maxAltitude) {
        maxAltitude = currentAltitude;
    }

    // 追加生成
    if (player.y - 1000 < fireflies[fireflies.length - 1].y) {
        generateFireflies(player.y - 2000);
    }

    // 落下ゲームオーバー
    if (player.y - cameraY > canvas.height + 150) {
        gameState = 'GAMEOVER';
    }

    fireflies.forEach(ff => ff.pulse += 0.04);
}

function drawSpider(x, y, radius) {
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(0, 4, radius * 0.7, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, -4, radius * 0.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(-2, 2, 4, 4);

    ctx.strokeStyle = '#222';
    ctx.lineWidth = 2.5;
    const legSpreads = [-0.8, -0.3, 0.3, 0.8];
    legSpreads.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(-3, -2);
        ctx.lineTo(-12, -2 + angle * 10);
        ctx.lineTo(-16, 4 + angle * 12);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(3, -2);
        ctx.lineTo(12, -2 + angle * 10);
        ctx.lineTo(16, 4 + angle * 12);
        ctx.stroke();
    });

    ctx.fillStyle = '#fff';
    ctx.fillRect(-3, -6, 2, 2);
    ctx.fillRect(1, -6, 2, 2);

    ctx.restore();
}

function draw() {
    let altRatio = Math.min(1, maxAltitude / 1000);
    let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    
    let topColor = `rgb(${Math.floor(5 * (1 - altRatio))}, ${Math.floor(5 * (1 - altRatio))}, ${Math.floor(16 * (1 - altRatio))})`;
    let bottomColor = `rgb(${Math.floor(40 * (1 - altRatio))}, ${Math.floor(15 * (1 - altRatio))}, ${Math.floor(50 * (1 - altRatio))})`;
    
    grad.addColorStop(0, topColor);
    grad.addColorStop(1, bottomColor);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(0, -cameraY);

    // 星
    stars.forEach(star => {
        ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + Math.sin(Date.now() * 0.003 + star.alpha) * 0.3})`;
        ctx.fillRect(star.x, star.y, star.size, star.size);
    });

    // 地面
    const groundY = canvas.height - 30;
    ctx.fillStyle = '#1e272e';
    ctx.fillRect(0, groundY, canvas.width, 500);
    ctx.fillStyle = '#2ed573';
    ctx.fillRect(0, groundY, canvas.width, 6);

    // 巨大化したホタルの描画
    fireflies.forEach(ff => {
        const glow = Math.sin(ff.pulse) * 5;
        let radialGrad = ctx.createRadialGradient(ff.x, ff.y, 4, ff.x, ff.y, ff.radius + 18 + glow);
        radialGrad.addColorStop(0, 'rgba(241, 196, 15, 0.95)');
        radialGrad.addColorStop(0.35, 'rgba(241, 196, 15, 0.4)');
        radialGrad.addColorStop(1, 'rgba(241, 196, 15, 0)');
        
        ctx.fillStyle = radialGrad;
        ctx.beginPath();
        ctx.arc(ff.x, ff.y, ff.radius + 20 + glow, 0, Math.PI * 2);
        ctx.fill();

        // 核心
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(ff.x, ff.y, ff.radius * 0.6, 0, Math.PI * 2);
        ctx.fill();
    });

    // 蜘蛛の糸（直線・またはたわみ状態）
    if (player.ropeState === 'SHOOTING') {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.ropeX, player.ropeY);
        ctx.stroke();
    } else if (player.ropeState === 'ATTACHED' && player.targetFirefly) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        
        // 糸がたわんでいる（内側にいる）場合は少し弛んだ曲線を描画
        let dist = Math.hypot(player.x - player.targetFirefly.x, player.y - player.targetFirefly.y);
        if (dist < player.currentRopeLen - 10) {
            let midX = (player.x + player.targetFirefly.x) / 2;
            let midY = (player.y + player.targetFirefly.y) / 2 + (player.currentRopeLen - dist) * 0.3; // 下方向にたわむ
            ctx.quadraticCurveTo(midX, midY, player.targetFirefly.x, player.targetFirefly.y);
        } else {
            ctx.lineTo(player.targetFirefly.x, player.targetFirefly.y);
        }
        ctx.stroke();
    }

    // クモ
    drawSpider(player.x, player.y, player.radius);

    // 矢印
    if (player.ropeState === 'IDLE' && gameState === 'PLAYING') {
        const arrowDist = 36;
        const ax = player.x + Math.cos(player.angle) * arrowDist;
        const ay = player.y + Math.sin(player.angle) * arrowDist;

        ctx.save();
        ctx.translate(ax, ay);
        ctx.rotate(player.angle);

        ctx.fillStyle = '#ff4757';
        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.lineTo(-6, -7);
        ctx.lineTo(-2, 0);
        ctx.lineTo(-6, 7);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }

    ctx.restore();

    // UI
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px monospace';
    ctx.textAlign = 'right';
    ctx.fillText(`高度: ${maxAltitude} m`, canvas.width - 20, 40);

    if (gameState === 'START') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 28px sans-serif';
        ctx.fillText('ドット絵グモの夜空登り', canvas.width / 2, canvas.height / 2 - 40);
        ctx.font = '16px sans-serif';
        ctx.fillText('タップしてスタート', canvas.width / 2, canvas.height / 2 + 20);
    } else if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff4757';
        ctx.textAlign = 'center';
        ctx.font = 'bold 32px sans-serif';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 50);

        ctx.fillStyle = '#fff';
        ctx.font = '20px sans-serif';
        ctx.fillText(`最高到達度: ${maxAltitude} m`, canvas.width / 2, canvas.height / 2);
        
        ctx.font = '16px sans-serif';
        ctx.fillText('タップしてリトライ', canvas.width / 2, canvas.height / 2 + 60);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
