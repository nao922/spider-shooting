<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spider Climb - 蜘蛛の糸登り</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
            font-family: monospace, sans-serif;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// キャンバスリサイズ処理
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// --- ゲーム定数 & 変数 ---
const GRAVITY = 0.25;
const ARROW_SPEED = 0.05; // 矢印の回転速度
const ROPE_SPEED = 22;    // 糸の伸びる速度
const ROPE_PULL_SPEED = 8; // 糸がターゲットに引き寄せられる速度
const REST_LENGTH = 100;   // 振り子状態の目標糸長

let gameState = 'START'; // 'START', 'PLAYING', 'GAMEOVER'
let cameraY = 0;
let maxAltitude = 0;
let stars = [];

// プレイヤー（クモ）定義
let player = {
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    radius: 12,
    angle: 0, // 矢印の角度
    ropeState: 'IDLE', // 'IDLE', 'SHOOTING', 'ATTACHED'
    ropeX: 0,
    ropeY: 0,
    ropeVx: 0,
    ropeVy: 0,
    ropeLen: 0,
    targetFirefly: null
};

// ホタル（障害物/フック地点）配列
let fireflies = [];

// 星の生成
function initStars() {
    stars = [];
    for (let i = 0; i < 150; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * -10000,
            size: Math.random() * 2 + 1,
            alpha: Math.random()
        });
    }
}

// ゲーム初期化
function initGame() {
    player.x = canvas.width / 2;
    player.y = canvas.height - 100;
    player.vx = 0;
    player.vy = 0;
    player.angle = -Math.PI / 2;
    player.ropeState = 'IDLE';
    player.targetFirefly = null;

    cameraY = 0;
    maxAltitude = 0;

    // 初期ホタル生成
    fireflies = [];
    // スタート地点近くの地上・近距離ホタル
    fireflies.push({ x: canvas.width / 2, y: canvas.height - 250, radius: 8, pulse: 0 });
    
    // 上空にランダム配置
    generateFireflies(-5000);

    initStars();
    gameState = 'PLAYING';
}

// ホタルのランダム生成
function generateFireflies(upToY) {
    let startY = fireflies.length > 0 ? fireflies[fireflies.length - 1].y - 120 : canvas.height - 400;
    while (startY > upToY) {
        const x = Math.random() * (canvas.width - 120) + 60;
        fireflies.push({
            x: x,
            y: startY,
            radius: 8 + Math.random() * 4,
            pulse: Math.random() * Math.PI * 2
        });
        startY -= 100 + Math.random() * 80; // 間隔
    }
}

// --- 入力処理 ---
function handleTap() {
    if (gameState === 'START' || gameState === 'GAMEOVER') {
        initGame();
        return;
    }

    if (player.ropeState === 'IDLE') {
        // 糸を発射
        player.ropeState = 'SHOOTING';
        player.ropeX = player.x;
        player.ropeY = player.y;
        player.ropeVx = Math.cos(player.angle) * ROPE_SPEED;
        player.ropeVy = Math.sin(player.angle) * ROPE_SPEED;
    } else if (player.ropeState === 'ATTACHED' || player.ropeState === 'SHOOTING') {
        // 糸を切断・リセット
        player.ropeState = 'IDLE';
        player.targetFirefly = null;
    }
}

window.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handleTap();
});

// --- 更新ロジック ---
function update() {
    if (gameState !== 'PLAYING') return;

    // 1. 矢印の回転（IDLE時のみ）
    if (player.ropeState === 'IDLE') {
        player.angle += ARROW_SPEED;
    }

    // 2. 糸の発射処理
    if (player.ropeState === 'SHOOTING') {
        player.ropeX += player.ropeVx;
        player.ropeY += player.ropeVy;

        // 糸の限界距離チェック
        const distFromPlayer = Math.hypot(player.ropeX - player.x, player.ropeY - player.y);
        if (distFromPlayer > 600) {
            player.ropeState = 'IDLE'; // 届かなかった場合リセット
        }

        // ホタルとの当たり判定
        for (let ff of fireflies) {
            const d = Math.hypot(player.ropeX - ff.x, player.ropeY - ff.y);
            if (d < ff.radius + 10) {
                player.ropeState = 'ATTACHED';
                player.targetFirefly = ff;
                player.ropeX = ff.x;
                player.ropeY = ff.y;
                break;
            }
        }
    }

    // 3. 物理移動・振り子処理
    if (player.ropeState === 'ATTACHED' && player.targetFirefly) {
        const ff = player.targetFirefly;
        let dx = player.x - ff.x;
        let dy = player.y - ff.y;
        let dist = Math.hypot(dx, dy);

        // 重力加算
        player.vy += GRAVITY;

        // 位置の予測更新
        player.x += player.vx;
        player.y += player.vy;

        dx = player.x - ff.x;
        dy = player.y - ff.y;
        dist = Math.hypot(dx, dy);

        // 糸が巻き取られる（目標長さまで縮む）
        if (dist > REST_LENGTH) {
            let targetDist = Math.max(REST_LENGTH, dist - ROPE_PULL_SPEED);
            
            // 拘束条件の適用（糸の張力計算）
            let nx = dx / dist;
            let ny = dy / dist;

            player.x = ff.x + nx * targetDist;
            player.y = ff.y + ny * targetDist;

            // 速度ベクトルを糸の直交方向に射影（振り子運動）
            let dot = player.vx * nx + player.vy * ny;
            player.vx -= dot * nx;
            player.vy -= dot * ny;
            
            // 減衰（空気抵抗）
            player.vx *= 0.995;
            player.vy *= 0.995;
        }
    } else {
        // 通常の自由落下
        player.vy += GRAVITY;
        player.x += player.vx;
        player.y += player.vy;
        player.vx *= 0.99; // 空気抵抗
    }

    // 壁との跳ね返り
    if (player.x - player.radius < 0) {
        player.x = player.radius;
        player.vx *= -0.6;
    } else if (player.x + player.radius > canvas.width) {
        player.x = canvas.width - player.radius;
        player.vx *= -0.6;
    }

    // 地面（スタート地点）との衝突
    const groundY = canvas.height - 30;
    if (player.y + player.radius > groundY) {
        player.y = groundY - player.radius;
        player.vy = 0;
        player.vx *= 0.8;
    }

    // カメラ位置更新（クモを画面中央下に保持）
    const targetCameraY = player.y - canvas.height * 0.65;
    if (targetCameraY < cameraY) {
        cameraY += (targetCameraY - cameraY) * 0.1; // 上方向へスムーズに追従
    }

    // スコア（高度）計算
    const currentAltitude = Math.floor((canvas.height - 30 - player.y) / 10);
    if (currentAltitude > maxAltitude) {
        maxAltitude = currentAltitude;
    }

    // ホタルの追加生成
    if (player.y - 1000 < fireflies[fireflies.length - 1].y) {
        generateFireflies(player.y - 2000);
    }

    // 落下によるゲームオーバー判定（画面下外に落ちた場合）
    if (player.y - cameraY > canvas.height + 150) {
        gameState = 'GAMEOVER';
    }

    // ホタルの点滅アニメーション
    fireflies.forEach(ff => ff.pulse += 0.05);
}

// --- ドット絵クモの描画 ---
function drawSpider(x, y, radius) {
    ctx.save();
    ctx.translate(x, y);

    // 体（黒/濃いグレー）
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(0, 4, radius * 0.7, 0, Math.PI * 2);
    ctx.fill();

    // 頭
    ctx.beginPath();
    ctx.arc(0, -4, radius * 0.5, 0, Math.PI * 2);
    ctx.fill();

    // 赤いドット模様（背中）
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(-2, 2, 4, 4);

    // 8本の足（ピクセル風にライン描画）
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 2.5;
    const legSpreads = [-0.8, -0.3, 0.3, 0.8];
    legSpreads.forEach(angle => {
        // 左足
        ctx.beginPath();
        ctx.moveTo(-3, -2);
        ctx.lineTo(-12, -2 + angle * 10);
        ctx.lineTo(-16, 4 + angle * 12);
        ctx.stroke();

        // 右足
        ctx.beginPath();
        ctx.moveTo(3, -2);
        ctx.lineTo(12, -2 + angle * 10);
        ctx.lineTo(16, 4 + angle * 12);
        ctx.stroke();
    });

    // 目（白いドット）
    ctx.fillStyle = '#fff';
    ctx.fillRect(-3, -6, 2, 2);
    ctx.fillRect(1, -6, 2, 2);

    ctx.restore();
}

// --- 描画ロジック ---
function draw() {
    // 1. 背景（高度に応じた夕暮れ〜宇宙へのグラデーション）
    let altRatio = Math.min(1, maxAltitude / 1000); // 1000mで完全な夜空
    let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    
    // 夕暮れ（紫/赤みがかった色）から深い紺黒へ
    let topColor = `rgb(${Math.floor(5 * (1 - altRatio))}, ${Math.floor(5 * (1 - altRatio))}, ${Math.floor(16 * (1 - altRatio))})`;
    let bottomColor = `rgb(${Math.floor(40 * (1 - altRatio))}, ${Math.floor(15 * (1 - altRatio))}, ${Math.floor(50 * (1 - altRatio))})`;
    
    grad.addColorStop(0, topColor);
    grad.addColorStop(1, bottomColor);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(0, -cameraY);

    // 2. 星の描画
    stars.forEach(star => {
        ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + Math.sin(Date.now() * 0.003 + star.alpha) * 0.3})`;
        ctx.fillRect(star.x, star.y, star.size, star.size);
    });

    // 3. 地面の描画
    const groundY = canvas.height - 30;
    ctx.fillStyle = '#1e272e';
    ctx.fillRect(0, groundY, canvas.width, 500);
    ctx.fillStyle = '#2ed573';
    ctx.fillRect(0, groundY, canvas.width, 6); // 草原のライン

    // 4. ホタル（発光障害物）の描画
    fireflies.forEach(ff => {
        const glow = Math.sin(ff.pulse) * 3;
        // 光のオーラ
        let radialGrad = ctx.createRadialGradient(ff.x, ff.y, 2, ff.x, ff.y, ff.radius + 8 + glow);
        radialGrad.addColorStop(0, 'rgba(241, 196, 15, 0.9)');
        radialGrad.addColorStop(0.4, 'rgba(241, 196, 15, 0.3)');
        radialGrad.addColorStop(1, 'rgba(241, 196, 15, 0)');
        
        ctx.fillStyle = radialGrad;
        ctx.beginPath();
        ctx.arc(ff.x, ff.y, ff.radius + 10 + glow, 0, Math.PI * 2);
        ctx.fill();

        // 核心ドット
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(ff.x, ff.y, ff.radius * 0.5, 0, Math.PI * 2);
        ctx.fill();
    });

    // 5. 蜘蛛の糸の描画
    if (player.ropeState === 'SHOOTING' || player.ropeState === 'ATTACHED') {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.ropeX, player.ropeY);
        ctx.stroke();
    }

    // 6. クモの描画
    drawSpider(player.x, player.y, player.radius);

    // 7. 回転矢印の描画（IDLE時のみ）
    if (player.ropeState === 'IDLE' && gameState === 'PLAYING') {
        const arrowDist = 35;
        const ax = player.x + Math.cos(player.angle) * arrowDist;
        const ay = player.y + Math.sin(player.angle) * arrowDist;

        ctx.save();
        ctx.translate(ax, ay);
        ctx.rotate(player.angle);

        ctx.fillStyle = '#ff4757';
        ctx.beginPath();
        ctx.moveTo(8, 0);
        ctx.lineTo(-6, -6);
        ctx.lineTo(-2, 0);
        ctx.lineTo(-6, 6);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }

    ctx.restore();

    // 8. UIの描画（画面固定）
    // 右上の高度スコア
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px monospace';
    ctx.textAlign = 'right';
    ctx.fillText(`高度: ${maxAltitude} m`, canvas.width - 20, 40);

    // オーバーレイ画面（スタート / ゲームオーバー）
    if (gameState === 'START') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 28px sans-serif';
        ctx.fillText('ドット絵グモの夜空登り', canvas.width / 2, canvas.height / 2 - 40);
        ctx.font = '16px sans-serif';
        ctx.fillText('画面をタップしてスタート', canvas.width / 2, canvas.height / 2 + 20);
        ctx.fillText('回転する矢印の方向に糸を飛ばします', canvas.width / 2, canvas.height / 2 + 50);
    } else if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff4757';
        ctx.textAlign = 'center';
        ctx.font = 'bold 32px sans-serif';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 50);

        ctx.fillStyle = '#fff';
        ctx.font = '20px sans-serif';
        ctx.fillText(`最高到達度: ${maxAltitude} m`, canvas.width / 2, canvas.height / 2);
        
        ctx.font = '16px sans-serif';
        ctx.fillText('タップしてリトライ', canvas.width / 2, canvas.height / 2 + 60);
    }
}

// --- メインループ ---
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
